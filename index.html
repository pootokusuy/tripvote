<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TripVote - Itinerary Planner</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;

            color: #172033;

        }


        button,
        input {

            font-family: inherit;

        }


        button {

            cursor: pointer;

        }


        .container {

            width:
                min(
                    1100px,
                    calc(100% - 32px)
                );

            margin: auto;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            padding:
                30px
                0
                15px;

        }


        .brand {

            font-size: 26px;

            font-weight: 800;

        }


        .brand span {

            color: #2563eb;

        }


        .subtitle {

            margin-top: 6px;

            color: #667085;

        }


        /* =========================
           TOP BAR
        ========================= */

        .topbar {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            margin:
                25px
                0;

        }


        .topbar h1 {

            font-size: 28px;

        }


        .topbar p {

            margin-top: 5px;

            color: #667085;

        }


        /* =========================
           BUTTON
        ========================= */

        .btn {

            border: none;

            border-radius: 12px;

            padding:
                12px
                18px;

            font-size: 14px;

            font-weight: 700;

        }


        .btn-primary {

            background: #2563eb;

            color: white;

        }


        .btn-primary:hover {

            background: #1d4ed8;

        }


        .btn-secondary {

            background: #f2f4f7;

            color: #344054;

        }


        .btn-outline {

            background: white;

            border:
                1px solid
                #d0d5dd;

            color: #344054;

        }


        .btn-danger {

            background: #fee2e2;

            color: #b91c1c;

        }


        .btn-danger:hover {

            background: #fecaca;

        }


        /* =========================
           HOME CARDS
        ========================= */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 18px;

        }


        .card {

            background: white;

            border:
                1px solid
                #e5e7eb;

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                0 10px 30px
                rgba(
                    16,
                    24,
                    40,
                    .06
                );

        }


        .trip-title {

            font-size: 20px;

            font-weight: 800;

            margin-bottom: 10px;

        }


        .status {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding:
                6px
                10px;

            border-radius: 999px;

            background: #fff7ed;

            color: #d97706;

            font-size: 13px;

            font-weight: 700;

        }


        .status.final {

            background: #ecfdf3;

            color: #16a34a;

        }


        .trip-info {

            color: #667085;

            font-size: 14px;

            margin-top: 13px;

        }


        .card-actions {

            display: flex;

            gap: 9px;

            flex-wrap: wrap;

            margin-top: 18px;

        }


        .delete-btn {

            margin-left: auto;

            background: transparent;

            border:
                1px solid
                #fecaca;

            color: #dc2626;

            border-radius: 10px;

            padding:
                9px
                12px;

            font-size: 13px;

            font-weight: 700;

        }


        .delete-btn:hover {

            background: #fef2f2;

        }


        .empty {

            text-align: center;

            padding:
                70px
                20px;

        }


        .empty-icon {

            font-size: 50px;

            margin-bottom: 15px;

        }


        .empty h2 {

            margin-bottom: 8px;

        }


        .empty p {

            color: #667085;

            margin-bottom: 22px;

        }


        /* =========================
           MODAL
        ========================= */

        .modal-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(
                    15,
                    23,
                    42,
                    .55
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 100;

        }


        .modal {

            background: white;

            width:
                min(
                    900px,
                    100%
                );

            max-height: 92vh;

            overflow-y: auto;

            border-radius: 22px;

            padding: 25px;

            box-shadow:
                0 30px 80px
                rgba(
                    0,
                    0,
                    0,
                    .20
                );

        }


        .modal-header {

            display: flex;

            justify-content:
                space-between;

            gap: 20px;

            margin-bottom: 25px;

        }


        .modal-header h2 {

            font-size: 24px;

            margin-bottom: 6px;

        }


        .modal-header p {

            color: #667085;

            font-size: 14px;

        }


        .close-btn {

            border: none;

            background: #f2f4f7;

            width: 36px;

            height: 36px;

            border-radius: 50%;

            font-size: 22px;

        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 15px;

        }


        .form-group label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;

        }


        .form-group input {

            width: 100%;

            padding:
                11px
                12px;

            border:
                1px solid
                #d0d5dd;

            border-radius: 10px;

            outline: none;

            background: white;

        }


        .form-group input:focus,
        .destination-input:focus {

            border-color:
                #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    .10
                );

        }


        /* =========================
           SEPARATOR
        ========================= */

        .separator {

            display: flex;

            align-items: center;

            gap: 12px;

            margin:
                25px
                0
                15px;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 2px;

            color: #667085;

        }


        .separator::before,
        .separator::after {

            content: "";

            height: 1px;

            background: #e5e7eb;

            flex: 1;

        }


        /* =========================
           TIME SLOT
        ========================= */

        .slot {

            background: #fafbff;

            border:
                1px solid
                #e5e7eb;

            border-radius: 16px;

            padding: 17px;

            margin-bottom: 15px;

        }


        .slot-header {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin-bottom: 15px;

        }


        .slot-fields {

            display: grid;

            grid-template-columns:
                1.2fr
                .8fr
                .8fr;

            gap: 10px;

        }


        .remove-slot {

            border: none;

            background: #fee2e2;

            color: #b91c1c;

            padding:
                7px
                10px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 700;

        }


        /* =========================
           DESTINATION
        ========================= */

        .destinations {

            margin-top: 5px;

        }


        .destination-row {

            display: flex;

            gap: 8px;

            margin-top: 10px;

        }


        .destination-input {

            width: 100%;

            flex: 1;

            padding:
                11px
                12px;

            border:
                1px solid
                #d0d5dd;

            border-radius: 10px;

            outline: none;

        }


        .remove-destination {

            width: 40px;

            border: none;

            border-radius: 10px;

            background: #fee2e2;

            color: #dc2626;

            font-size: 20px;

        }


        .add-destination-btn {

            border: none;

            background: transparent;

            color: #2563eb;

            font-weight: 700;

            margin-top: 12px;

        }


        .add-slot-btn {

            width: 100%;

            border:
                1px dashed
                #93c5fd;

            background: #eff6ff;

            color: #2563eb;

            padding:
                11px
                15px;

            border-radius: 10px;

            font-weight: 700;

        }


        /* =========================
           MODAL FOOTER
        ========================= */

        .modal-footer {

            display: flex;

            justify-content:
                space-between;

            gap: 10px;

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid
                #e5e7eb;

        }


        /* =========================
           PAGE
        ========================= */

        .page {

            padding:
                20px
                0
                50px;

        }


        .back {

            margin-bottom: 15px;

        }


        .page-head {

            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            gap: 15px;

            margin-bottom: 25px;

        }


        .page-head h1 {

            font-size: 30px;

        }


        .page-head p {

            margin-top: 5px;

            color: #667085;

        }


        /* =========================
           NOTICE
        ========================= */

        .notice {

            background: #eff6ff;

            color: #1e40af;

            padding:
                13px
                15px;

            border-radius: 12px;

            font-size: 14px;

            margin-bottom: 16px;

        }


        /* =========================
           VOTING
        ========================= */

        .vote-card {

            margin-bottom: 16px;

        }


        .time {

            color: #2563eb;

            font-size: 13px;

            font-weight: 800;

            margin-bottom: 13px;

        }


        .option {

            display: flex;

            align-items: center;

            gap: 12px;

            border:
                1px solid
                #e5e7eb;

            border-radius: 12px;

            padding: 13px;

            margin: 8px 0;

            transition: .15s;

        }


        .option:hover {

            border-color:
                #93c5fd;

            background:
                #eff6ff;

        }


        .option input {

            width: 18px;

            height: 18px;

            accent-color:
                #2563eb;

        }


        .option.selected {

            border-color:
                #93c5fd;

            background:
                #eff6ff;

        }


        .vote-footer {

            text-align: right;

            margin-top: 20px;

        }


        /* =========================
           RESULTS
        ========================= */

        .result-row {

            margin:
                14px
                0;

        }


        .result-top {

            display: flex;

            justify-content:
                space-between;

            gap: 10px;

            font-size: 14px;

            margin-bottom: 7px;

        }


        .bar {

            height: 10px;

            border-radius: 999px;

            background:
                #e5e7eb;

            overflow: hidden;

        }


        .fill {

            height: 100%;

            background:
                #2563eb;

            border-radius:
                999px;

        }


        .winner {

            color:
                #16a34a;

            font-size: 12px;

            font-weight: 800;

            margin-left: 6px;

        }


        /* =========================
           FINAL VIEW
        ========================= */

        .final-item {

            display: flex;

            align-items: center;

            gap: 18px;

            padding:
                18px
                0;

            border-bottom:
                1px solid
                #e5e7eb;

        }


        .final-item:last-child {

            border-bottom:
                none;

        }


        .final-date {

            min-width:
                170px;

            color:
                #667085;

            font-size: 13px;

            font-weight: 700;

        }


        .final-place {

            font-size: 18px;

            font-weight: 800;

        }


        /* =========================
           TOAST
        ========================= */

        .toast {

            position: fixed;

            right: 18px;

            bottom: 18px;

            background:
                #111827;

            color: white;

            padding:
                13px
                16px;

            border-radius:
                12px;

            z-index: 200;

            box-shadow:
                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    .15
                );

        }


        /* =========================
           MOBILE
        ========================= */

        @media (
            max-width: 700px
        ) {

            .container {

                width:
                    calc(
                        100% - 22px
                    );

            }


            .topbar {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .topbar .btn {

                width:
                    100%;

            }


            .page-head {

                flex-direction:
                    column;

            }


            .slot-fields {

                grid-template-columns:
                    1fr;

            }


            .modal {

                padding:
                    18px;

                border-radius:
                    18px;

            }


            .modal-footer {

                flex-direction:
                    column-reverse;

            }


            .modal-footer button {

                width:
                    100%;

            }


            .final-item {

                align-items:
                    flex-start;

                flex-direction:
                    column;

                gap: 5px;

            }


            .final-date {

                min-width:
                    auto;

            }


            .delete-btn {

                margin-left:
                    0;

                width:
                    100%;

            }

        }

    </style>

</head>


<body>


    <div id="app"></div>


    <script>


        /* =====================================================
           STORAGE
        ===================================================== */


        const STORAGE_KEY =
            "tripvote_itineraries_v1";


        let itineraries =
            JSON.parse(
                localStorage.getItem(
                    STORAGE_KEY
                ) || "[]"
            );


        /*
            Anonymous participant ID.

            Setiap browser memiliki ID sendiri.
        */


        let participantId =
            localStorage.getItem(
                "tripvote_participant_id"
            );


        if (!participantId) {

            participantId =
                crypto.randomUUID
                ? crypto.randomUUID()
                : "participant-" +
                  Date.now() +
                  "-" +
                  Math.random()
                      .toString(16)
                      .slice(2);


            localStorage.setItem(
                "tripvote_participant_id",
                participantId
            );

        }


        /* =====================================================
           SAVE DATA
        ===================================================== */


        function saveData() {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    itineraries
                )
            );

        }


        /* =====================================================
           CREATE ID
        ===================================================== */


        function createId() {

            return crypto.randomUUID
                ? crypto.randomUUID()
                : "id-" +
                  Date.now() +
                  "-" +
                  Math.random()
                      .toString(16)
                      .slice(2);

        }


        /* =====================================================
           ESCAPE HTML
        ===================================================== */


        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
            .replace(
                /[&<>"']/g,
                function(char) {

                    const map = {

                        "&": "&amp;",

                        "<": "&lt;",

                        ">": "&gt;",

                        '"': "&quot;",

                        "'": "&#039;"

                    };

                    return map[
                        char
                    ];

                }
            );

        }


        /* =====================================================
           DATE FORMAT
        ===================================================== */


        function formatDate(
            date
        ) {

            if (!date) return "";


            const d =
                new Date(
                    date +
                    "T00:00:00"
                );


            return d.toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }
            );

        }


        /* =====================================================
           TOAST
        ===================================================== */


        function showToast(
            message
        ) {

            const toast =
                document.createElement(
                    "div"
                );


            toast.className =
                "toast";


            toast.textContent =
                message;


            document.body.appendChild(
                toast
            );


            setTimeout(
                function() {

                    toast.remove();

                },
                2200
            );

        }


        /* =====================================================
           HOME
        ===================================================== */


        function renderHome() {

            document.getElementById(
                "app"
            ).innerHTML = `

                <header>

                    <div class="container">

                        <div class="brand">

                            ✈️ Trip<span>Vote</span>

                        </div>


                        <p class="subtitle">

                            Create an itinerary,
                            let the group vote,
                            then finalize the
                            winning plan.

                        </p>

                    </div>

                </header>


                <main
                    class="container"
                >


                    <div
                        class="topbar"
                    >

                        <div>

                            <h1>
                                My Itineraries
                            </h1>


                            <p>
                                Your trips and
                                their voting status.
                            </p>

                        </div>


                        <button
                            class="
                                btn
                                btn-primary
                            "
                            onclick="
                                openCreate()
                            "
                        >

                            ＋ New Itinerary

                        </button>

                    </div>


                    ${
                        itineraries.length

                        ?

                        `

                        <div
                            class="grid"
                        >

                            ${
                                itineraries
                                    .map(
                                        createTripCard
                                    )
                                    .join("")
                            }

                        </div>

                        `

                        :

                        `

                        <div
                            class="
                                card
                                empty
                            "
                        >

                            <div
                                class="
                                    empty-icon
                                "
                            >

                                🗺️

                            </div>


                            <h2>

                                No itineraries yet

                            </h2>


                            <p>

                                Create your first
                                group itinerary
                                and let everyone
                                vote on the
                                destinations.

                            </p>


                            <button
                                class="
                                    btn
                                    btn-primary
                                "
                                onclick="
                                    openCreate()
                                "
                            >

                                ＋ New Itinerary

                            </button>

                        </div>

                        `
                    }

                </main>

            `;

        }


        /* =====================================================
           TRIP CARD
        ===================================================== */


        function createTripCard(
            trip
        ) {

            const finalized =
                trip.status ===
                "finalized";


            return `

                <div
                    class="card"
                >


                    <div
                        class="trip-title"
                    >

                        📍

                        ${escapeHTML(
                            trip.destination
                        )}

                    </div>


                    <span
                        class="
                            status
                            ${
                                finalized
                                ? "final"
                                : ""
                            }
                        "
                    >

                        ${
                            finalized
                            ? "🟢 Finalized"
                            : "🟡 Voting Open"
                        }

                    </span>


                    <p
                        class="
                            trip-info
                        "
                    >

                        ${
                            trip.slots.length
                        }

                        time slot
                        ${
                            trip.slots.length !== 1
                            ? "s"
                            : ""
                        }

                    </p>


                    <div
                        class="
                            card-actions
                        "
                    >


                        <button
                            class="
                                btn
                                btn-secondary
                            "
                            onclick="
                                openTrip(
                                    '${trip.id}'
                                )
                            "
                        >

                            ${
                                finalized
                                ? "Final View"
                                : "View"
                            }

                        </button>


                        ${
                            !finalized

                            ?

                            `

                            <button
                                class="
                                    btn
                                    btn-outline
                                "
                                onclick="
                                    showResults(
                                        '${trip.id}'
                                    )
                                "
                            >

                                View Results

                            </button>

                            `

                            :

                            ""

                        }


                        <!-- DELETE -->

                        <button
                            class="
                                delete-btn
                            "
                            onclick="
                                deleteItinerary(
                                    '${trip.id}'
                                )
                            "
                        >

                            🗑 Delete

                        </button>


                    </div>

                </div>

            `;

        }


        /* =====================================================
           DELETE ITINERARY
        ===================================================== */


        function deleteItinerary(
            id
        ) {

            const trip =
                itineraries.find(
                    item =>
                        item.id === id
                );


            if (!trip) return;


            const confirmed =
                confirm(

                    "Delete itinerary?\n\n" +

                    "Destination: " +
                    trip.destination +
                    "\n\n" +

                    "All voting data for this " +
                    "itinerary will also be deleted."

                );


            if (!confirmed) {

                return;

            }


            itineraries =
                itineraries.filter(
                    item =>
                        item.id !== id
                );


            saveData();


            renderHome();


            showToast(
                "Itinerary deleted."
            );

        }


        /* =====================================================
           CREATE MODAL
        ===================================================== */


        function openCreate() {

            const modal =
                document.createElement(
                    "div"
                );


            modal.className =
                "modal-overlay";


            modal.id =
                "createModal";


            modal.innerHTML = `

                <div
                    class="modal"
                >


                    <div
                        class="
                            modal-header
                        "
                    >

                        <div>

                            <h2>
                                Create New Itinerary
                            </h2>


                            <p>

                                Create your trip
                                and add
                                destinations for
                                the group to vote on.

                            </p>

                        </div>


                        <button
                            class="
                                close-btn
                            "
                            onclick="
                                closeCreate()
                            "
                        >

                            ×

                        </button>

                    </div>


                    <!-- MAIN DESTINATION -->


                    <div
                        class="
                            form-group
                        "
                    >

                        <label>

                            Main Destination

                        </label>


                        <input
                            type="text"
                            id="mainDestination"
                            placeholder="
                                e.g. Bandung
                            "
                        >

                    </div>


                    <div
                        class="separator"
                    >

                        ITINERARY

                    </div>


                    <!-- SLOTS -->


                    <div
                        id="
                            slotsContainer
                        "
                    ></div>


                    <!-- ADD SLOT -->


                    <button
                        class="
                            add-slot-btn
                        "
                        onclick="
                            addSlot()
                        "
                    >

                        ＋ Add Time Slot

                    </button>


                    <!-- FOOTER -->


                    <div
                        class="
                            modal-footer
                        "
                    >

                        <button
                            class="
                                btn
                                btn-secondary
                            "
                            onclick="
                                closeCreate()
                            "
                        >

                            Cancel

                        </button>


                        <button
                            class="
                                btn
                                btn-primary
                            "
                            onclick="
                                finishCreate()
                            "
                        >

                            Finish

                        </button>

                    </div>

                </div>

            `;


            document.body.appendChild(
                modal
            );


            addSlot();

        }


        /* =====================================================
           CLOSE CREATE
        ===================================================== */


        function closeCreate() {

            const modal =
                document.getElementById(
                    "createModal"
                );


            if (modal) {

                modal.remove();

            }

        }


        /* =====================================================
           ADD SLOT
        ===================================================== */


        function addSlot() {

            const container =
                document.getElementById(
                    "slotsContainer"
                );


            if (!container) return;


            const slotNumber =
                container.children.length +
                1;


            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "slot";


            slot.innerHTML = `

                <div
                    class="slot-header"
                >

                    <strong>

                        Time Slot
                        ${slotNumber}

                    </strong>


                    <button
                        class="
                            remove-slot
                        "
                        onclick="
                            removeSlot(
                                this
                            )
                        "
                    >

                        Remove

                    </button>

                </div>


                <div
                    class="
                        slot-fields
                    "
                >


                    <div
                        class="
                            form-group
                        "
                    >

                        <label>
                            Date
                        </label>


                        <input
                            type="date"
                            class="slot-date"
                        >

                    </div>


                    <div
                        class="
                            form-group
                        "
                    >

                        <label>
                            Start Time
                        </label>


                        <input
                            type="time"
                            class="slot-start"
                        >

                    </div>


                    <div
                        class="
                            form-group
                        "
                    >

                        <label>
                            End Time
                        </label>


                        <input
                            type="time"
                            class="slot-end"
                        >

                    </div>


                </div>


                <div
                    class="destinations"
                >


                    <div
                        class="
                            destination-row
                        "
                    >

                        <input
                            type="text"
                            class="
                                destination-input
                            "
                            placeholder="
                                e.g. Gedung Sate
                            "
                        >


                        <button
                            class="
                                remove-destination
                            "
                            onclick="
                                removeDestination(
                                    this
                                )
                            "
                        >

                            ×

                        </button>

                    </div>


                </div>


                <button
                    class="
                        add-destination-btn
                    "
                    onclick="
                        addDestination(
                            this
                        )
                    "
                >

                    ＋ Add destination

                </button>

            `;


            container.appendChild(
                slot
            );

        }


        /* =====================================================
           ADD DESTINATION
        ===================================================== */


        function addDestination(
            button
        ) {

            const slot =
                button.closest(
                    ".slot"
                );


            const container =
                slot.querySelector(
                    ".destinations"
                );


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "destination-row";


            row.innerHTML = `

                <input
                    type="text"
                    class="
                        destination-input
                    "
                    placeholder="
                        e.g. Braga
                    "
                >


                <button
                    class="
                        remove-destination
                    "
                    onclick="
                        removeDestination(
                            this
                        )
                    "
                >

                    ×

                </button>

            `;


            container.appendChild(
                row
            );

        }


        /* =====================================================
           REMOVE DESTINATION
        ===================================================== */


        function removeDestination(
            button
        ) {

            const row =
                button.closest(
                    ".destination-row"
                );


            if (row) {

                row.remove();

            }

        }


        /* =====================================================
           REMOVE SLOT
        ===================================================== */


        function removeSlot(
            button
        ) {

            const slot =
                button.closest(
                    ".slot"
                );


            if (slot) {

                slot.remove();

            }


            updateSlotNumbers();

        }


        /* =====================================================
           UPDATE SLOT NUMBERS
        ===================================================== */


        function updateSlotNumbers() {

            const slots =
                document.querySelectorAll(
                    "#slotsContainer .slot"
                );


            slots.forEach(
                (
                    slot,
                    index
                ) => {

                    slot.querySelector(
                        "strong"
                    ).textContent =
                        "Time Slot " +
                        (index + 1);

                }
            );

        }


        /* =====================================================
           FINISH CREATE
        ===================================================== */


        function finishCreate() {

            const destination =
                document
                    .getElementById(
                        "mainDestination"
                    )
                    .value
                    .trim();


            if (!destination) {

                alert(
                    "Please enter the main destination."
                );

                return;

            }


            const slots =
                document.querySelectorAll(
                    "#slotsContainer .slot"
                );


            if (slots.length === 0) {

                alert(
                    "Please add at least one time slot."
                );

                return;

            }


            const slotData = [];


            for (
                let i = 0;
                i < slots.length;
                i++
            ) {

                const slot =
                    slots[i];


                const date =
                    slot.querySelector(
                        ".slot-date"
                    ).value;


                const start =
                    slot.querySelector(
                        ".slot-start"
                    ).value;


                const end =
                    slot.querySelector(
                        ".slot-end"
                    ).value;


                const destinations =
                    [
                        ...slot.querySelectorAll(
                            ".destination-input"
                        )
                    ]
                    .map(
                        input =>
                            input.value.trim()
                    )
                    .filter(
                        value =>
                            value !== ""
                    );


                if (
                    !date ||
                    !start ||
                    !end
                ) {

                    alert(
                        "Please complete the date and time for every slot."
                    );

                    return;

                }


                if (
                    destinations.length === 0
                ) {

                    alert(
                        "Please add at least one destination to every time slot."
                    );

                    return;

                }


                slotData.push({

                    id:
                        createId(),

                    date:
                        date,

                    start:
                        start,

                    end:
                        end,

                    destinations:
                        destinations

                });

            }


            const confirmation =
                confirm(

                    "Are you sure?\n\n" +

                    "Yes = save this itinerary " +
                    "and open voting.\n\n" +

                    "No = return to the form."

                );


            if (!confirmation) {

                return;

            }


            const newTrip = {

                id:
                    createId(),

                destination:
                    destination,

                status:
                    "voting",

                slots:
                    slotData,

                votes:
                    {},

                createdAt:
                    new Date()
                        .toISOString()

            };


            itineraries.unshift(
                newTrip
            );


            saveData();


            closeCreate();


            renderHome();


            showToast(
                "Itinerary created. Voting is open!"
            );

        }


        /* =====================================================
           OPEN TRIP
        ===================================================== */


        function openTrip(
            id
        ) {

            const trip =
                itineraries.find(
                    item =>
                        item.id === id
                );


            if (!trip) return;


            if (
                trip.status ===
                "finalized"
            ) {

                renderFinal(
                    trip
                );

                return;

            }


            renderVoting(
                trip
            );

        }


        /* =====================================================
           VOTING PAGE
        ===================================================== */


        function renderVoting(
            trip
        ) {

            document.getElementById(
                "app"
            ).innerHTML = `

                <header>

                    <div
                        class="container"
                    >

                        <div
                            class="brand"
                        >

                            ✈️ Trip<span>
                                Vote
                            </span>

                        </div>

                    </div>

                </header>


                <main
                    class="
                        container
                        page
                    "
                >


                    <button
                        class="
                            btn
                            btn-outline
                            back
                        "
                        onclick="
                            renderHome()
                        "
                    >

                        ← Back

                    </button>


                    <div
                        class="
                            page-head
                        "
                    >

                        <div>

                            <h1>

                                ${escapeHTML(
                                    trip.destination
                                )}

                            </h1>


                            <p>

                                Choose exactly
                                one destination
                                per time slot.

                            </p>

                        </div>

                    </div>


                    <div
                        class="notice"
                    >

                        Choose one destination
                        for every time slot.

                        Your latest vote is
                        saved when you submit.

                    </div>


                    ${
                        trip.slots
                            .map(
                                slot => {

                                    const selected =
                                        trip.votes
                                        ?.[
                                            participantId
                                        ]
                                        ?.[
                                            slot.id
                                        ];


                                    return `

                                        <div
                                            class="
                                                card
                                                vote-card
                                            "
                                        >


                                            <div
                                                class="time"
                                            >

                                                ${formatDate(
                                                    slot.date
                                                )}

                                                ·

                                                ${slot.start}

                                                –

                                                ${slot.end}

                                            </div>


                                            ${
                                                slot
                                                    .destinations
                                                    .map(
                                                        destination => `

                                                            <label
                                                                class="
                                                                    option
                                                                    ${
                                                                        selected ===
                                                                        destination
                                                                        ? "selected"
                                                                        : ""
                                                                    }
                                                                "
                                                            >


                                                                <input
                                                                    type="radio"
                                                                    name="slot-${slot.id}"
                                                                    value="${escapeHTML(
                                                                        destination
                                                                    )}"
                                                                    ${
                                                                        selected ===
                                                                        destination
                                                                        ? "checked"
                                                                        : ""
                                                                    }
                                                                    onchange="
                                                                        updateOptionStyle(
                                                                            this
                                                                        )
                                                                    "
                                                                >


                                                                <span>

                                                                    ${escapeHTML(
                                                                        destination
                                                                    )}

                                                                </span>


                                                            </label>

                                                        `
                                                    )
                                                    .join("")
                                            }

                                        </div>

                                    `;

                                }
                            )
                            .join("")
                    }


                    <div
                        class="
                            vote-footer
                        "
                    >

                        <button
                            class="
                                btn
                                btn-primary
                            "
                            onclick="
                                submitVote(
                                    '${trip.id}'
                                )
                            "
                        >

                            Submit Vote

                        </button>

                    </div>


                </main>

            `;

        }


        /* =====================================================
           RADIO STYLE
        ===================================================== */


        function updateOptionStyle(
            input
        ) {

            const card =
                input.closest(
                    ".vote-card"
                );


            card
                .querySelectorAll(
                    ".option"
                )
                .forEach(
                    option =>
                        option.classList
                            .remove(
                                "selected"
                            )
                );


            input
                .closest(
                    ".option"
                )
                .classList
                .add(
                    "selected"
                );

        }


        /* =====================================================
           SUBMIT VOTE
        ===================================================== */


        function submitVote(
            id
        ) {

            const trip =
                itineraries.find(
                    item =>
                        item.id === id
                );


            if (!trip) return;


            const choices = {};


            for (
                const slot
                of trip.slots
            ) {


                const selected =
                    document.querySelector(
                        `input[name="slot-${slot.id}"]:checked`
                    );


                if (!selected) {

                    alert(
                        "Please choose one destination for every time slot."
                    );

                    return;

                }


                choices[
                    slot.id
                ] =
                    selected.value;

            }


            trip.votes =
                trip.votes ||
                {};


            trip.votes[
                participantId
            ] =
                choices;


            saveData();


            showToast(
                "Vote submitted!"
            );


            renderVoting(
                trip
            );

        }


        /* =====================================================
           GET VOTE COUNTS
        ===================================================== */


        function getVoteCounts(
            trip,
            slot
        ) {

            const counts = {};


            slot.destinations.forEach(
                destination => {

                    counts[
                        destination
                    ] = 0;

                }
            );


            Object.values(
                trip.votes || {}
            )
            .forEach(
                votes => {

                    const choice =
                        votes[
                            slot.id
                        ];


                    if (
                        choice &&
                        counts[
                            choice
                        ] !== undefined
                    ) {

                        counts[
                            choice
                        ]++;

                    }

                }
            );


            return counts;

        }


        /* =====================================================
           RESULTS
        ===================================================== */


        function showResults(
            id
        ) {

            const trip =
                itineraries.find(
                    item =>
                        item.id === id
                );


            if (!trip) return;


            const totalVoters =
                Object.keys(
                    trip.votes || {}
                ).length;


            document.getElementById(
                "app"
            ).innerHTML = `

                <header>

                    <div
                        class="container"
                    >

                        <div
                            class="brand"
                        >

                            ✈️ Trip<span>
                                Vote
                            </span>

                        </div>

                    </div>

                </header>


                <main
                    class="
                        container
                        page
                    "
                >


                    <button
                        class="
                            btn
                            btn-outline
                            back
                        "
                        onclick="
                            renderHome()
                        "
                    >

                        ← Back

                    </button>


                    <div
                        class="
                            page-head
                        "
                    >

                        <div>

                            <h1>

                                Voting Results —

                                ${escapeHTML(
                                    trip.destination
                                )}

                            </h1>


                            <p>

                                ${totalVoters}

                                participant
                                ${
                                    totalVoters !== 1
                                    ? "s"
                                    : ""
                                }

                                voted

                            </p>

                        </div>

                    </div>


                    ${
                        trip.slots
                            .map(
                                slot => {

                                    const counts =
                                        getVoteCounts(
                                            trip,
                                            slot
                                        );


                                    const total =
                                        Object.values(
                                            counts
                                        )
                                        .reduce(
                                            (
                                                a,
                                                b
                                            ) =>
                                                a + b,
                                            0
                                        );


                                    const max =
                                        Math.max(
                                            ...Object.values(
                                                counts
                                            )
                                        );


                                    return `

                                        <div
                                            class="
                                                card
                                                vote-card
                                            "
                                        >


                                            <div
                                                class="time"
                                            >

                                                ${formatDate(
                                                    slot.date
                                                )}

                                                ·

                                                ${slot.start}

                                                –

                                                ${slot.end}

                                            </div>


                                            ${
                                                slot.destinations
                                                    .map(
                                                        destination => {

                                                            const votes =
                                                                counts[
                                                                    destination
                                                                ] ||
                                                                0;


                                                            const percentage =
                                                                total
                                                                ?
                                                                Math.round(
                                                                    votes /
                                                                    total *
                                                                    100
                                                                )
                                                                :
                                                                0;


                                                            const isWinner =
                                                                votes ===
                                                                max &&
                                                                max > 0;


                                                            return `

                                                                <div
                                                                    class="
                                                                        result-row
                                                                    "
                                                                >


                                                                    <div
                                                                        class="
                                                                            result-top
                                                                        "
                                                                    >

                                                                        <span>

                                                                            ${escapeHTML(
                                                                                destination
                                                                            )}


                                                                            ${
                                                                                isWinner
                                                                                ?

                                                                                `

                                                                                <span
                                                                                    class="
                                                                                        winner
                                                                                    "
                                                                                >

                                                                                    WINNER

                                                                                </span>

                                                                                `

                                                                                :

                                                                                ""
                                                                            }

                                                                        </span>


                                                                        <strong>

                                                                            ${votes}

                                                                            vote
                                                                            ${
                                                                                votes !== 1
                                                                                ? "s"
                                                                                : ""
                                                                            }

                                                                            ·

                                                                            ${percentage}%

                                                                        </strong>

                                                                    </div>


                                                                    <div
                                                                        class="
                                                                            bar
                                                                        "
                                                                    >

                                                                        <div
                                                                            class="
                                                                                fill
                                                                            "
                                                                            style="
                                                                                width:
                                                                                ${percentage}%
                                                                            "
                                                                        ></div>

                                                                    </div>


                                                                </div>

                                                            `;

                                                        }
                                                    )
                                                    .join("")
                                            }

                                        </div>

                                    `;

                                }
                            )
                            .join("")
                    }


                    <div
                        style="
                            text-align:right;
                            margin-top:20px;
                        "
                    >

                        <button
                            class="
                                btn
                                btn-primary
                            "
                            onclick="
                                finalizeTrip(
                                    '${trip.id}'
                                )
                            "
                        >

                            Finalize Itinerary

                        </button>

                    </div>


                </main>

            `;

        }


        /* =====================================================
           FINALIZE
        ===================================================== */


        function finalizeTrip(
            id
        ) {

            const trip =
                itineraries.find(
                    item =>
                        item.id === id
                );


            if (!trip) return;


            const confirmation =
                confirm(

                    "Finalize Itinerary?\n\n" +

                    "The winning destination " +
                    "in each time slot will " +
                    "become the final itinerary.\n\n" +

                    "This action cannot be undone."

                );


            if (!confirmation) {

                return;

            }


            trip.slots.forEach(
                slot => {

                    const counts =
                        getVoteCounts(
                            trip,
                            slot
                        );


                    const max =
                        Math.max(
                            ...Object.values(
                                counts
                            )
                        );


                    let winner =
                        slot.destinations[
                            0
                        ];


                    if (max > 0) {

                        winner =
                            slot.destinations
                                .find(
                                    destination =>
                                        counts[
                                            destination
                                        ] === max
                                );

                    }


                    slot.winner =
                        winner;


                    slot.winnerVotes =
                        max;

                }
            );


            trip.status =
                "finalized";


            trip.finalizedAt =
                new Date()
                    .toISOString();


            saveData();


            renderHome();


            showToast(
                "Itinerary finalized!"
            );

        }


        /* =====================================================
           FINAL VIEW
        ===================================================== */


        function renderFinal(
            trip
        ) {

            document.getElementById(
                "app"
            ).innerHTML = `

                <header>

                    <div
                        class="container"
                    >

                        <div
                            class="brand"
                        >

                            ✈️ Trip<span>
                                Vote
                            </span>

                        </div>

                    </div>

                </header>


                <main
                    class="
                        container
                        page
                    "
                >


                    <button
                        class="
                            btn
                            btn-outline
                            back
                        "
                        onclick="
                            renderHome()
                        "
                    >

                        ← Back

                    </button>


                    <div
                        class="
                            page-head
                        "
                    >

                        <div>

                            <h1>

                                Final View —

                                ${escapeHTML(
                                    trip.destination
                                )}

                            </h1>


                            <p>

                                Final itinerary
                                selected by
                                group voting.

                            </p>

                        </div>


                        <span
                            class="
                                status
                                final
                            "
                        >

                            🟢 Finalized

                        </span>

                    </div>


                    <div
                        class="card"
                    >

                        ${
                            trip.slots
                                .map(
                                    slot => `

                                        <div
                                            class="
                                                final-item
                                            "
                                        >


                                            <div
                                                class="
                                                    final-date
                                                "
                                            >

                                                ${formatDate(
                                                    slot.date
                                                )}

                                                <br>

                                                ${slot.start}

                                                –

                                                ${slot.end}

                                            </div>


                                            <div
                                                class="
                                                    final-place
                                                "
                                            >

                                                📍

                                                ${escapeHTML(
                                                    slot.winner ||
                                                    slot.destinations[
                                                        0
                                                    ]
                                                )}

                                            </div>


                                        </div>

                                    `
                                )
                                .join("")
                        }

                    </div>


                </main>

            `;

        }


        /* =====================================================
           START
        ===================================================== */


        renderHome();


    </script>


</body>
